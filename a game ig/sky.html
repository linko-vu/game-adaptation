
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Portal</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('click-listener', {
        init: function () {
          this.el.addEventListener('click', () => {
            const msg = document.querySelector('#message');
            if (!msg) return;

            msg.setAttribute('value', 'Portal activated!');
            msg.setAttribute('visible', true);
            setTimeout(() => {
              msg.setAttribute('visible', false);
            }, 2000);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene fog="type: exponential; color: #925380; density: 0.05">
      <a-assets>
        <a-asset-item id="ground" src="ground.glb"></a-asset-item>
        <a-asset-item id="portal" src="sci-fi_portal_gateway.glb"></a-asset-item>
      </a-assets>

      <a-entity camera position="0 1.6 0" look-controls wasd-controls cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <a-text id="message" value="Portal activated!" position="0 0 -1" align="center" visible="false" width="4" negate="true"></a-text>
      </a-entity>

      <a-entity light="type: ambient; color: #eccdec"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0 -1 0"></a-entity>

      <a-sky src="images/morning sky.jpeg" rotation="0 -130 0" position="0 -5 0" material="fog: false"></a-sky>
      <a-entity gltf-model="#ground" position="0 0 0" scale="1.5 1.5 1.5"></a-entity>
      <a-entity gltf-model="#portal" class="clickable" position="10 0 -4" rotation="0 -30 0" click-listener></a-entity>
    </a-scene>
  </body>
</html>
